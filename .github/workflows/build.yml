on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build
        run: |
          npm i
          node esbuild.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: dist
